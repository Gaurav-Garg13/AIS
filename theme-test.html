<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-white dark:bg-[#0B0B0B] min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">Theme Switching Test</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">Test both light and dark modes</p>
        
        <div class="bg-white dark:bg-white/5 backdrop-blur-xl rounded-2xl border border-gray-200 dark:border-white/10 p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Sample Content</h2>
            <p class="text-gray-700 dark:text-gray-300 mb-4">This is sample text to test visibility in both themes.</p>
            
            <div class="flex gap-2 mb-4">
                <button onclick="setTheme('light')" class="px-4 py-2 bg-white text-gray-900 border border-gray-300 rounded-lg hover:bg-gray-100">Light</button>
                <button onclick="setTheme('dark')" class="px-4 py-2 bg-gray-900 text-white border border-gray-600 rounded-lg hover:bg-gray-800">Dark</button>
            </div>
            
            <input type="text" placeholder="Test input" class="w-full px-4 py-2 bg-white dark:bg-white/10 border border-gray-300 dark:border-white/20 rounded-lg text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
        </div>
        
        <div class="bg-gray-100 dark:bg-gray-800 rounded-lg p-4">
            <p class="text-gray-600 dark:text-gray-400">Current theme: <span id="current-theme" class="font-semibold">light</span></p>
        </div>
    </div>
    
    <script>
        function setTheme(theme) {
            const root = document.documentElement;
            if (theme === 'dark') {
                root.classList.add('dark');
            } else {
                root.classList.remove('dark');
            }
            document.getElementById('current-theme').textContent = theme;
        }
        
        // Check system preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            setTheme('dark');
        }
    </script>
</body>
</html>
